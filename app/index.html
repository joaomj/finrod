<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finrod">
  <title>Finrod</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <aside id="sidebar" aria-label="Conversas">
    <button id="new" type="button">Nova conversa</button>
    <nav id="list"></nav>
    <button id="exa" type="button" hidden></button>
  </aside>
  <div id="scrim" hidden></div>
  <main>
    <header>
      <button id="menu" type="button" aria-label="Conversas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="title">Finrod</h1>
    </header>
    <section id="messages" aria-live="polite"></section>
    <form id="composer">
      <div id="tray" hidden></div>
      <div class="line">
        <button id="attach" type="button" aria-label="Anexar arquivo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5 12 21a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 19a2 2 0 0 1-3-3l8-8"/></svg>
        </button>
        <input id="picker" type="file" multiple hidden
          accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,text/markdown,text/csv,.pdf,.txt,.md,.csv">
        <textarea id="input" rows="1" placeholder="Mensagem" autocomplete="off" enterkeyhint="send" aria-label="Mensagem"></textarea>
        <button id="send" type="submit" aria-label="Enviar" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </main>
</body>
</html>
