<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finrod">
  <title>Finrod</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <div id="app">
    <header id="bar">
      <button id="menu" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>Finrod</h1>
      <button id="search" type="button" aria-label="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
    </header>
    <section id="messages" aria-live="polite"></section>
    <form id="composer">
      <div id="notes"></div>
      <div id="tray" hidden></div>
      <div id="line">
        <button id="attach" type="button" aria-label="Anexar arquivo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5 12 21a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 19a2 2 0 0 1-3-3l8-8"/></svg>
        </button>
        <input id="picker" type="file" multiple hidden
          accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,text/markdown,text/csv,.pdf,.txt,.md,.csv">
        <textarea id="input" rows="1" placeholder="Mensagem" autocomplete="off" enterkeyhint="send" aria-label="Mensagem"></textarea>
        <button id="round" type="button" class="off" aria-label="Enviar (segure para falar)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div id="rec" hidden>
        <span class="dot"></span>
        <span id="timer">0:00</span>
        <div id="wave" aria-hidden="true"></div>
        <button id="pause" type="button" class="icon" aria-label="Pausar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        </button>
        <button id="cancel" type="button" class="icon" aria-label="Cancelar gravação">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="finish" type="button" class="icon solid" aria-label="Enviar gravação">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p id="hint">toque envia · segure para falar</p>
    </form>
    <div id="scrim" hidden></div>
    <section id="sheet" hidden aria-modal="true" role="dialog"></section>
  </div>
</body>
</html>
