name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - run: scripts/package.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(release/finrod-"$GITHUB_REF_NAME".tar.gz release/finrod-"$GITHUB_REF_NAME".tar.gz.sha256)
          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}" \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Finrod $GITHUB_REF_NAME" --generate-notes "${files[@]}"
